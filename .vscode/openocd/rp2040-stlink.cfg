# El driver st-link de OpenOCD no soporta SWD multidrop (TARGETSEL), que es
# lo que activa target/rp2040.cfg al crear el DAP con -dp-id/-instance-id,
# incluso limitando la sesion a un solo nucleo con USE_CORE. Aqui se recrea
# el target de core0 sin esos parametros, para forzar una conexion SWD
# clasica (sin multidrop) compatible con el driver st-link.
transport select swd
source [find target/swj-dp.tcl]

set _CHIPNAME rp2040
set _CPUTAPID 0x01002927
set _WORKAREASIZE 0x10000
set _FLASHSIZE 0

swj_newdap $_CHIPNAME cpu -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap0 -chain-position $_CHIPNAME.cpu

set _TARGETNAME_0 $_CHIPNAME.core0
target create $_TARGETNAME_0 cortex_m -dap $_CHIPNAME.dap0
$_TARGETNAME_0 cortex_m reset_config sysresetreq
$_TARGETNAME_0 configure -event reset-init { rp2xxx rom_api_call 0 CX }
$_TARGETNAME_0 configure -work-area-phys 0x20010000 -work-area-size $_WORKAREASIZE -work-area-backup 1

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME rp2xxx 0x10000000 $_FLASHSIZE 0 0 $_TARGETNAME_0
